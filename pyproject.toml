[project]
name = "fcp-consolidation"
version = "0.1.0"
description = "Herramienta local para procesar por etapas los archivos de Excel de la consolidación del informe de ejecución presupuestal y financiera del FCP."
readme = "README.md"
authors = [
    { name = "René Valencia Vallejo", email = "renevalencia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-calamine>=0.9.0",
    "streamlit>=1.65.0",
]

[tool.uv]
# Es una aplicación que se ejecuta desde la carpeta, no una librería instalable.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
